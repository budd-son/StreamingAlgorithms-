<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Потоковые алгоритмы — дополненная презентация</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f1f3f6;color:#151515}body{overflow:hidden}
#stage{height:100%;display:grid;place-items:center;padding:18px}
.slide{display:none;position:relative;width:min(96vw,calc(96vh * 16 / 9));aspect-ratio:16/9;background:#fff;padding:6% 7%;border-radius:12px;box-shadow:0 12px 42px #0002;overflow:hidden}
.slide.active{display:flex;flex-direction:column}h1{font-size:clamp(25px,3vw,44px);line-height:1.12;margin:0 0 3%;font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;overflow:auto;align-content:start}
.item{font-size:clamp(15px,1.45vw,21px);line-height:1.35;padding:12px 16px;border-radius:9px;background:#e4edfc}
.item:nth-child(3n+2){background:#f3f3f3}.item:nth-child(3n){background:#f9e8ed}
.foot{position:absolute;bottom:3%;left:7%;right:7%;display:flex;justify-content:space-between;color:#777;font-size:13px}
.controls{position:fixed;bottom:0;left:0;right:0;background:#17191d;color:#fff;display:flex;justify-content:center;align-items:center;gap:12px;padding:9px}
button{border:1px solid #555;background:#2a3038;color:white;border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}
#progress{height:4px;background:#3478d4;position:fixed;bottom:0;left:0;width:0;transition:width .2s}
@media(max-width:650px){#stage{padding:5px}.slide{width:98vw;padding:7% 6%}.items{grid-template-columns:1fr;gap:7px}.item{font-size:15px;padding:8px 10px}.foot{font-size:10px}.controls{gap:6px}.controls button{padding:7px 10px}}
</style></head><body><main id="stage"></main>
<div class="controls"><button id="prev">← Назад</button><span id="count">1 / 31</span><button id="next">Вперёд →</button><button id="full">Во весь экран</button></div><div id="progress"></div>
<script>
const slides=[["Потоковые алгоритмы","Теория алгоритмов, 3 курс","Heavy hitters, Count-Min Sketch, HyperLogLog, медиана потока","Нехайчик Софья"],["«В потоке данных вы не можете позволить себе роскошь оглянуться назад: либо вы поняли суть на лету, либо она потеряна навсегда».","— Брайан Керниган"],["Поточный алгоритм","Обработка последовательности данных в один или малое число проходов.","Строго один проход: каждый элемент читается один раз.","Сублинейная память: O(1), O(polylog N) или O(1/ε).","Ответ может быть приближённым: ошибка ε с вероятностью не меньше 1 − δ."],["Модели потоковых данных","Cash Register — только добавления (+1). Пример: счётчик запросов.","Turnstile — добавления и удаления (+1 или −1).","Strict Turnstile — обновления могут быть отрицательными, но частота остаётся неотрицательной.","Sliding Window — учитываем только последние события или заданный интервал времени.","Count-Min в базовом виде рассчитан на добавления; обычный HyperLogLog не поддерживает удаления."],["История: от идеи к формализации","Нога Алон · Йосси Матиас · Марио Сегеди","1980-е: первые работы · 1996: формализация понятия · 2005: премия Гёделя и полупоточные алгоритмы"],["Какой подход выбрать","Точный ответ: детерминированные алгоритмы, дополнительные проходы или больше памяти.","Приближённый ответ: вероятностные скетчи с контролируемой ошибкой.","Выбор зависит от ε, δ, допустимой памяти и семантики обновлений."],["Задача: самый частый элемент","Числа приходят по одному. Какое встречается чаще всех?","Пример потока: 3, 7, 3, 1, 3, 5, 3, 7, 3, 9, 3, 1, 3, 7, 3, 3."],["Решение в лоб: счётчик для каждого числа","Для каждого уникального значения храним отдельный счётчик.","Время — O(N), память — O(D), где D — число различных значений.","Если почти все элементы уникальны, словарь может быть почти размером с поток."],["Идея потокового решения: помнить только двоих","Для поиска большинства можно хранить кандидата и баланс.","Разные элементы взаимно компенсируются; элемент с частотой больше N/2 переживёт компенсации.","Память не зависит от длины потока."],["Бойер–Мур: пары разных отбрасываем","Лидер встречается больше N/2 раз.","Пары различных элементов можно мысленно вычёркивать: большинство не исчезнет полностью.","После прохода получаем кандидата, но его нужно проверить точным подсчётом."],["Бойер–Мур: правила","Храним кандидата и счётчик.","Если счётчик равен нулю — текущий элемент становится кандидатом.","Если элемент совпадает с кандидатом — счётчик +1; иначе — счётчик −1.","Время O(N), дополнительная память O(1)."],["Бойер–Мур: пример","Счётчик растёт при совпадении с кандидатом и уменьшается при другом значении.","Когда баланс обнуляется, следующий элемент может стать новым кандидатом.","Для строгого ответа проверяем, что кандидат встречается больше N/2 раз."],["Мисра–Грис: частые элементы больше N/k","Храним не более k − 1 счётчиков.","Если элемент уже есть — увеличиваем его счётчик.","Если есть свободная ячейка — добавляем элемент.","Если ячеек нет — уменьшаем все счётчики на 1 и удаляем нулевые."],["Мисра–Грис: пример, k = 3","Храним два счётчика; порог — N/3.","При нехватке ячеек уменьшаем оба счётчика.","Счётчики после компенсаций могут быть меньше истинных частот.","Все элементы с частотой строго больше N/k останутся среди кандидатов."],["Мисра–Грис: зачем второй проход","Первый проход оставляет не более k − 1 кандидатов.","Тяжёлый элемент не будет пропущен, но могут остаться лишние кандидаты.","Второй проход точно считает частоты кандидатов и проверяет порог."],["Count-Min: куда попадает элемент","Матрица счётчиков и несколько хеш-функций.","Каждая хеш-функция выбирает ячейку в своей строке; при добавлении увеличиваем её на 1.","Коллизии добавляют посторонний вклад и могут завышать частоту."],["Count-Min Sketch: частота любого элемента","Для запроса ключа повторно вычисляем позиции во всех строках.","Оценка — минимум из выбранных счётчиков.","Минимум уменьшает влияние коллизий; в модели добавлений оценка не занижает частоту."],["Count-Min: гарантия","f(x) ≤ оценка ≤ f(x) + ε · N с вероятностью не меньше 1 − δ.","Ширина w = ⌈e / ε⌉; число рядов d = ⌈ln(1 / δ)⌉.","Гарантия относится к стандартной модели неотрицательных добавлений."],["HyperLogLog: сколько разных элементов","Хешируем элемент и смотрим на длину начальной серии нулей.","Длинные серии редки; максимумы по регистрам позволяют оценить число уникальных элементов.","Относительная стандартная ошибка порядка 1,04 / √m, где m — число регистров.","Стандартный HyperLogLog не поддерживает прямое удаление элементов."],["Reservoir Sampling: случайная выборка из потока","Нужно сохранить K случайных элементов из потока неизвестной длины.","Первые K элементов помещаем в резервуар.","Для i-го элемента выбираем j равномерно из [1, i]. Если j ≤ K — заменяем элемент j.","После N элементов каждый имеет вероятность K/N попасть в выборку. Память O(K)."],["Bloom Filter: встречался ли элемент?","Компактная вероятностная проверка принадлежности множеству.","Добавление: устанавливаем k битов, выбранных хеш-функциями.","Проверка: хотя бы один ноль — точно НЕТ; все единицы — возможно, ДА.","Возможны ложноположительные ответы; структура не хранит ключи и не считает частоты.","Для удаления используют специальные варианты, например Counting Bloom Filter."],["Top-K: минимальная куча","Поддерживаем min-кучу размера K.","Корень — минимальный элемент среди текущих K лидеров.","Новый элемент сильнее корня — вытесняем корень; иначе игнорируем.","Память O(K), обновление кучи O(log K)."],["Top-K: обработка ключа","Если ключ уже в куче — обновляем его частоту и восстанавливаем кучу.","Если места достаточно — добавляем ключ.","Иначе сравниваем с корнем и заменяем его, если новый кандидат сильнее.","Для частотного Top-K нужна отдельная стратегия оценки ключей вне кучи."],["Top-K в продакшене: два эшелона","Первый эшелон: Space-Saving или Count-Min фиксированного размера.","Второй эшелон: куча Top-K для ограниченного набора кандидатов.","Так миллионы редких ключей не раздувают память.","Гарантии разных скетчей различаются — их нельзя смешивать без анализа."],["Медиана потока: две кучи","Max-куча хранит нижнюю половину, min-куча — верхнюю.","Размеры куч отличаются не более чем на один элемент.","Медиана доступна по вершинам; вставка O(log N).","Это точный алгоритм, но память O(N). P² и t-digest — приближённые методы для квантилей."],["Скользящие окна: анализ недавних событий","Окно по количеству событий — последние N элементов.","Временное окно — например, последние 5 минут.","Старые события можно удалять из очереди или учитывать с меньшим весом.","Экспоненциальное затухание: вес exp(−λ(t−tᵢ)).","Примеры: ошибки за 5 минут, запросы за минуту, rate limiting."],["Брокеры сообщений: откуда берётся поток","Источники: сервисы, датчики, логи → брокер → потребители со скетчами → метрики и алерты.","Kafka хранит события в журнале; потребитель читает с нужного смещения и может перечитать поток.","Учитываем порядок, повторы доставки, партиционирование и обратное давление."],["Потоковые алгоритмы и машинное обучение","Онлайновое обучение: обновление модели по мере поступления данных; пример — стохастический градиентный спуск.","Хеширование признаков отображает признаки в вектор фиксированной длины.","Reservoir Sampling помогает получать выборку; окна и затухание — учитывать дрейф распределения.","MinHash и SimHash применяются для поиска почти-дубликатов."],["Потоковые алгоритмы и безопасность","Misra–Gries и Count-Min помогают искать источники большого объёма трафика.","HyperLogLog оценивает число уникальных адресов или портов.","Bloom Filter используется для предварительной проверки URL и блок-листов.","Rate limiting может опираться на компактные оценки частот.","Защита от подбора коллизий: качественные хеши и секретные случайные seed."],["Где применяется и итоги","Частые элементы: Boyer–Moore, Misra–Gries. Частоты: Count-Min.","Уникальные элементы: HyperLogLog. Проверка членства: Bloom Filter.","Случайная выборка: Reservoir Sampling. Top-K: min-куча.","Медиана и квантили: две кучи, P², t-digest. Недавняя история: скользящие окна.","Главный выбор — точность, память, поддержка удалений и временной горизонт."],["Вопросы","Почему Count-Min только завышает оценку, а Misra–Gries только занижает счётчики?","Почему нельзя усреднять p99 с разных серверов?","Что сломается в HyperLogLog, если нужны удаления?","Зачем Misra–Gries второй проход?"]];
const stage=document.getElementById('stage');
slides.forEach((parts,i)=>{const s=document.createElement('section');s.className='slide'+(i===0?' active':'');const h=document.createElement('h1');h.textContent=parts[0];s.append(h);const items=document.createElement('div');items.className='items';parts.slice(1).forEach(t=>{const d=document.createElement('div');d.className='item';d.textContent=t;items.append(d)});s.append(items);const f=document.createElement('div');f.className='foot';f.innerHTML='<span>Потоковые алгоритмы</span><span>'+ (i+1)+' / '+slides.length+'</span>';s.append(f);stage.append(s)});
const all=[...document.querySelectorAll('.slide')];let n=0;function show(x){n=Math.max(0,Math.min(all.length-1,x));all.forEach((s,i)=>s.classList.toggle('active',i===n));document.getElementById('count').textContent=(n+1)+' / '+all.length;document.getElementById('progress').style.width=((n+1)/all.length*100)+'%'}
document.getElementById('prev').onclick=()=>show(n-1);document.getElementById('next').onclick=()=>show(n+1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(n+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(n-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});
let x=0;document.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX);document.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-x;if(Math.abs(d)>50)show(n+(d<0?1:-1))});show(0);
</script></body></html>
