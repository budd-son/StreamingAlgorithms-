
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Потоковые алгоритмы</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        .slide-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            max-width: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide {
            display: none;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: white;
        }
        .slide.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            backdrop-filter: blur(5px);
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .counter { font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="slide-container">
    <img src="pages/slide_1.jpg" class="slide active" id="slide0">
    <img src="pages/slide_2.jpg" class="slide" id="slide1">
    <img src="pages/slide_3.jpg" class="slide" id="slide2">
    <img src="pages/slide_4.jpg" class="slide" id="slide3">
    <img src="pages/slide_5.jpg" class="slide" id="slide4">
    <img src="pages/slide_6.jpg" class="slide" id="slide5">
    <img src="pages/slide_7.jpg" class="slide" id="slide6">
    <img src="pages/slide_8.jpg" class="slide" id="slide7">
    <img src="pages/slide_9.jpg" class="slide" id="slide8">
    <img src="pages/slide_10.jpg" class="slide" id="slide9">
    <img src="pages/slide_11.jpg" class="slide" id="slide10">
    <img src="pages/slide_12.jpg" class="slide" id="slide11">
    <img src="pages/slide_13.jpg" class="slide" id="slide12">
    <img src="pages/slide_14.jpg" class="slide" id="slide13">
    <img src="pages/slide_15.jpg" class="slide" id="slide14">
    <img src="pages/slide_16.jpg" class="slide" id="slide15">
    <img src="pages/slide_17.jpg" class="slide" id="slide16">
    <img src="pages/slide_18.jpg" class="slide" id="slide17">
    <img src="pages/slide_19.jpg" class="slide" id="slide18">
    <img src="pages/slide_20.jpg" class="slide" id="slide19">
    <img src="pages/slide_21.jpg" class="slide" id="slide20">
    <img src="pages/slide_22.jpg" class="slide" id="slide21">
    <img src="pages/slide_23.jpg" class="slide" id="slide22">
    <img src="pages/slide_24.jpg" class="slide" id="slide23">
    <img src="pages/slide_25.jpg" class="slide" id="slide24">
    <img src="pages/slide_26.jpg" class="slide" id="slide25">
    <img src="pages/slide_27.jpg" class="slide" id="slide26">
    <img src="pages/slide_28.jpg" class="slide" id="slide27">
    <img src="pages/slide_29.jpg" class="slide" id="slide28">
    <img src="pages/slide_30.jpg" class="slide" id="slide29">
    <img src="pages/slide_31.jpg" class="slide" id="slide30">

</div>

<div class="controls">
    <button id="prevBtn" onclick="changeSlide(-1)">← Назад</button>
    <span class="counter" id="counter">1 / 31</span>
    <button id="nextBtn" onclick="changeSlide(1)">Вперед →</button>
</div>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.remove('active');
            if (i === index) slide.classList.add('active');
        });
        counter.textContent = `${index + 1} / ${slides.length}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide < 0) currentSlide = 0;
        if (currentSlide >= slides.length) currentSlide = slides.length - 1;
        showSlide(currentSlide);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space') changeSlide(1);
        if (e.key === 'ArrowLeft') changeSlide(-1);
    });

    showSlide(0);
</script>
</body>
</html>
